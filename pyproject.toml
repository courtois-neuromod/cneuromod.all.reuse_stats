[project]
name = "cneuromod-reuse-stats"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "airoh[datalad]>=0.5.0",
    "git-annex",
    "invoke",
    "requests",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "ruff",
    "pytest",
]

[tool.pytest.ini_options]
# Without this, collection walks into source_data/cneuromod.all (a symlink to
# the whole dataset) and appears to hang.
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
